
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NASearch</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>

<body>

    <div id="bg-media"></div>
    <div class="overlay"></div>

    <main class="content">

        <h1 class="heading">
            <span class="nas">NAS</span><span class="earch">earch</span>
        </h1>

        <form action="https://www.google.com/search" method="GET">
            <input
                type="search"
                class="search"
                name="q"
                placeholder="Search..."
            >
        
        </form>  

    </main>

    <section id="apps" class="content-section">

        <h2>Other Apps</h2>

        <div class="content-box" id="apps-container">
            <p>Useful apps will appear here.</p>
        </div>

    </section>

    <section id="music" class="content-section">

        <h2>Top Music</h2>
        
        <div class="content-box" id="music-container">
            <p>Loading top music...</p>
        </div>

    </section>

    <script src="script.js" defer></script>
</body>
</html>
